<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabWard</title>
  <style>
    :root {
      color-scheme: dark;
      font: 13px/1.4 system-ui, sans-serif;
      background: #202124;
      color: #f1f3f4;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid #3c4043;
    }
    .label {
      color: #bdc1c6;
    }
    .status {
      font-weight: 600;
      text-align: right;
    }
    .ok {
      color: #81c995;
    }
    .bad {
      color: #f28b82;
    }
    .warn {
      color: #fdd663;
    }
    #details {
      color: #bdc1c6;
      font-size: 11px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }
    .settings {
      margin-top: 16px;
      border-top: 1px solid #3c4043;
    }
    .setting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      padding: 12px 0;
      border-bottom: 1px solid #3c4043;
    }
    .setting-title {
      font-weight: 600;
    }
    .setting-help {
      grid-column: 1 / -1;
      color: #9aa0a6;
      font-size: 11px;
    }
    .switch {
      width: 40px;
      height: 24px;
      margin: 0;
      accent-color: #8ab4f8;
      cursor: pointer;
    }
    .switch:focus-visible,
    select:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #8ab4f8;
      outline-offset: 2px;
    }
    #settings-notice {
      min-height: 16px;
      margin-top: 8px;
      color: #bdc1c6;
      font-size: 11px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 7px 10px;
      border: 1px solid #5f6368;
      border-radius: 4px;
      background: #303134;
      color: #f1f3f4;
      cursor: pointer;
    }
    button:hover {
      background: #3c4043;
    }
    input,
    select {
      box-sizing: border-box;
      width: 100%;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid #5f6368;
      border-radius: 4px;
      background: #171717;
      color: #f1f3f4;
      letter-spacing: 0.2em;
      text-align: center;
    }
    select {
      width: auto;
      min-width: 112px;
      margin-top: 0;
      padding: 6px 8px;
      letter-spacing: normal;
      text-align: left;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>TabWard</h1>
  <div class="row"><span class="label" data-i18n="localMcp">Local MCP</span><span id="bridge" class="status"></span></div>
  <div class="row"><span class="label" data-i18n="extension">Extension</span><span id="extension" class="status"></span></div>
  <div id="details"></div>
  <section class="settings" data-i18n-aria-label="browserSettings">
    <label class="setting">
      <span class="setting-title" data-i18n="language">Language</span>
      <select id="language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
      <span class="setting-help" data-i18n="languageHelp">Your choice is saved for this extension.</span>
    </label>
    <label class="setting">
      <span class="setting-title" data-i18n="allowExisting">Allow access to existing tabs</span>
      <input id="allow-existing-tabs" class="switch" type="checkbox">
      <span class="setting-help" data-i18n="allowExistingHelp">Off by default. Applies only to full-profile sessions.</span>
    </label>
    <label class="setting">
      <span class="setting-title" data-i18n="separateWindow">Use a separate Chrome window</span>
      <input id="separate-window" class="switch" type="checkbox">
      <span class="setting-help" data-i18n="separateWindowHelp">When off, new tabs join a TabWard group in the current window.</span>
    </label>
  </section>
  <div id="settings-notice" role="status" aria-live="polite"></div>
  <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" data-i18n-placeholder="pairingPlaceholder" hidden>
  <button id="pair" type="button" data-i18n="approvePairing" hidden></button>
  <button id="revoke" type="button" data-i18n="revokePairing" hidden></button>
  <button id="refresh" type="button" data-i18n="refresh"></button>
  <script src="popup.js"></script>
</body>
</html>
